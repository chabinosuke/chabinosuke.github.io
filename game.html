  <!-- ==========================================
     星空自動生成用 JavaScript
     ========================================== -->
  <script>
    function generateStars(count, colors = ['#ffffff']) {
      let shadows = [];
      for (let i = 0; i < count; i++) {
        const x = Math.floor(Math.random() * 2000);
        const y = Math.floor(Math.random() * 1780);
        const color = colors[Math.floor(Math.random() * colors.length)];
        shadows.push(`${x}px ${y}px ${color}`);
      }
      return shadows.join(', ');
    }

    const starColors = ['#ffffff', '#ffffff', '#fef4f8', '#e0c1ff'];
    
    const styleElem = document.createElement('style');
    styleElem.innerHTML = `
      #stars, #stars::after { box-shadow: ${generateStars(400, starColors)}; }
      #stars2, #stars2::after { box-shadow: ${generateStars(150, starColors)}; }
      #stars3, #stars3::after { box-shadow: ${generateStars(80, starColors)}; }
      #stars4, #stars4::after { box-shadow: ${generateStars(40, starColors)}; }
    `;
    document.head.appendChild(styleElem);
  </script>
</body>
