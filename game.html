<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHABILAND GAME</title>
  
  <!-- アイコン表示 -->
  <link rel="shortcut icon" href="image/icon48_3.ico" type="image/icon">
  <link rel="apple-touch-icon" href="image/icon180_3.png" sizes="180x180">

  <link rel="stylesheet" href="all_style.css">
  
  <!-- ★ここから追加：ゲームボタン用の共通設定 -->
  <style>
    .game-btn {
      width: 300px;                  /* ボタンの横幅 */
      display: inline-block;
      box-sizing: border-box;
      letter-spacing: 0px;          /* 字間を少し詰める */
    }
  </style>
  
</head>

<body>
  <!-- 4重の星空要素 -->
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
  <div id="stars4"></div>

  <div class="wrapper">

    <!-- 端から端までの透明ボックス -->
    <div class="box">
      <span class="sub-text-1">GAME</span>
      <span class="sub-text-2">&#10028;&ensp;ADV・ノベルゲーム&ensp;&#10028;</span>
    </div>

    <div style="height: 30px;"></div>

    <!-- ここから新しい縦並びボタン群 -->

    <!-- ゲーム作品 1 -->
    <div class="section-margin" style="margin-bottom: 50px;">
      <img src="image/game_oshi_holic2.png" alt="推し押しHOLIC" style="width: 100%; max-width: 320px; height: auto; border-radius: 8px; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto;">
      <div class="btn-glow2">
        <!-- ★ class に game-btn を追加（styleは消してOKです） -->
        <a href="https://novelgame.jp/games/show/00000" target="_blank" class="btn-glow btn-hover-shine game-btn">推し押しHOLIC</a>
      </div>
      <div class="btn-desc">誠意制作中です</div>
    </div>

    <!-- ゲーム作品 2 -->
    <div class="section-margin" style="margin-bottom: 50px;">
      <img src="image/game_titleue_mengo.png" alt="めんごめんごのから騒ぎ" style="width: 100%; max-width: 320px; height: auto; border-radius: 8px; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto;">
      <div class="btn-glow2">
        <!-- ★ こちらも class に game-btn を追加 -->
        <a href="https://novelgame.jp/games/show/00000" target="_blank" class="btn-glow btn-hover-shine game-btn">めんごめんごのから騒ぎ</a>
      </div>
      <div class="btn-desc">公開日 / 2025/09/20</div>
    </div>
    

    <!-- 更新履歴（styleを追加して枠を強制表示） -->
    <div class="box2" style="display: block; width: 100%; clear: both;">
      <div class="history-title">更新履歴</div>
      <div>
        <span class="history-date">2026/07/27 &ensp; CI-EN &ensp; 推し押しHOLIC &ensp;</span>
        <span class="history-highlight">進捗５&#10028;更新</span>
      </div>
      <div>
        <span class="history-date">2026/07/22 &ensp; README &ensp;</span>
        <span class="history-highlight">Added an English version.</span>
      </div>
    </div>

    <div style="height: 30px;"></div>

    <!-- HOMEに戻るボタン（更新履歴の下 ＋ 中央揃え） -->
    <div class="section-margin" style="text-align: center;">
      <div class="btn-glow2">
        <a href="index.html" class="btn-glow btn-hover-shine"> HOMEに戻る </a>
      </div>
    </div>

    <!-- コピーライト -->
    <div class="copyright">
      © 2020 chabinosuke_<a href="https://chabinosukede.gozaru.jp/" target="_blank">.</a>
    </div>

  </div><!-- /.wrapper -->

  <!-- 星空自動生成用 JavaScript -->
  <script>
    function generateStars(count, colors = ['#ffffff']) {
      let shadows = [];
      for (let i = 0; i < count; i++) {
        const x = Math.floor(Math.random() * 2000);
        const y = Math.floor(Math.random() * 1780);
        const color = colors[Math.floor(Math.random() * colors.length)];
        shadows.push(`${x}px ${y}px ${color}`);
      }
      return shadows.join(', ');
    }

    const starColors = ['#ffffff', '#ffffff', '#fef4f8', '#e0c1ff'];
    
    const styleElem = document.createElement('style');
    styleElem.innerHTML = `
      #stars, #stars::after { box-shadow: ${generateStars(400, starColors)}; }
      #stars2, #stars2::after { box-shadow: ${generateStars(150, starColors)}; }
      #stars3, #stars3::after { box-shadow: ${generateStars(80, starColors)}; }
      #stars4, #stars4::after { box-shadow: ${generateStars(40, starColors)}; }
    `;
    document.head.appendChild(styleElem);
  </script>
</body>
</html>
