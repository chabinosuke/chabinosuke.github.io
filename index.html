<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャビノスケのWebサイト</title>
  <style>
    /* ==========================================
       全体基本設定
       ========================================== */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      padding: 20px 0 60px 0;
      text-align: center;
    }

    a {
      color: inherit;
    }

    /* ==========================================
       星空背景アニメーション (#stars)
       ========================================== */
    #stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      background: transparent;
      box-shadow: 
        768px 1070px #fff, 468px 194px #fff, 320px 1867px #fff, 1850px 185px #fff,
        380px 1616px #fff, 468px 1294px #fff, 1122px 1743px #fff, 884px 299px #fff,
        1300px 1917px #fff, 1860px 396px #fff, 1270px 990px #fff, 529px 733px #fff,
        1975px 1347px #fff, 1885px 685px #fff, 226px 506px #fff, 651px 878px #fff,
        1323px 680px #fff, 1284px 680px #fff, 238px 1967px #fff, 911px 174px #fff;
    }

    /* ==========================================
       透明ボックス スタイル
       ========================================== */
    .box {
      background-color: rgba(0, 0, 0, 0.5);
      color: #fff;
      margin: 20px auto;
      width: 90%;
      max-width: 600px;
      background: linear-gradient(to right, #010633, #000000);
      text-align: center;
      padding: 15px 20px;
      box-sizing: border-box;
      border-radius: 8px;
    }

    .sub-text-1 {
      font-size: 18px;
      color: #ffc1ff;
      display: block;
      margin-bottom: 5px;
    }

    .sub-text-2 {
      font-size: 18px;
      color: #c1c1ff;
      display: block;
    }

    /* 更新履歴ボックス */
    .box2 {
      background-color: rgba(2, 8, 60, 0.5);
      color: #fff;
      margin: 40px auto;
      width: 90%;
      max-width: 650px;
      background: linear-gradient(to right, #010633, #000000);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 8px;
      line-height: 1.8;
    }

    .history-title {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .history-date {
      color: #e0c1ff;
    }

    .history-highlight {
      color: #ffc1e0;
    }

    /* ==========================================
       レイアウト用グリッド（2列並びを崩さない）
       ========================================== */
    .grid-2col {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 50px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 180px;
    }

    .btn-desc {
      font-size: 14px;
      color: #bf92fc;
      margin-top: 10px;
    }

    .section-margin {
      margin-bottom: 50px;
    }

    /* アイコン画像グループ */
    .icon-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .icon-group img {
      transition: transform 0.2s;
    }

    .icon-group img:hover {
      transform: scale(1.05);
    }

    .header-banner {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    /* ==========================================
       ボタン演出
       ========================================== */
    .btn-glow2 {
      display: inline-block;
    }

    .btn-glow {
      color: #fff !important;
      display: inline-block;
      background: linear-gradient(to right, rgba(138, 97, 248, 1) 0%, rgba(236, 159, 231, 1) 100%);
      border: none;
      text-align: center;
      font-size: 20px;
      line-height: 50px;
      letter-spacing: 0.07em;
      text-decoration: none !important;
      text-transform: uppercase;
      padding: 0 30px;
      transition: 0.3s;
      animation: glow 3s infinite ease-out;
      border-radius: 50px;
      min-width: 120px;
      box-sizing: border-box;
    }

    .btn-glow:hover {
      background: linear-gradient(to right, rgba(203, 139, 232, 1) 0%, rgba(117, 68, 246, 1) 100%);
    }

    @keyframes glow {
      0% { box-shadow: 0 0 20px rgba(139, 97, 248, 0.27); }
      50% { box-shadow: 0 0 100px rgba(139, 97, 248, 0.93); }
      100% { box-shadow: 0 0 20px rgba(139, 97, 248, 0.27); }
    }

    .btn-hover-shine {
      position: relative;
      overflow: hidden;
    }

    .btn-hover-shine:after {
      content: '';
      position: absolute;
      top: 0;
      height: 100%;
      right: 80%;
      width: 1px;
      background-color: rgba(255, 255, 255, 0);
      opacity: 1;
    }

    .btn-hover-shine:hover:after {
      right: 2%;
      background-color: #ffffff;
      box-shadow: 0 0 30px #ffd2fe;
      opacity: 0;
      transition: 0.6s;
    }

    .copyright {
      color: #9966ff;
      font-size: 16px;
      margin-top: 40px;
    }
  </style>
</head>
