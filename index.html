<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャビノスケのWebサイト</title>
  <style>
    /* ==========================================
       全体基本設定 & 切れ目のないグラデーション背景
       ========================================== */
    html {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* ベース背景色 */
      background-color: #070a14;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* 切れ目を完全解消した「下からのピンク紫グラデーション」 */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #071246 30%, #1a0833 60%, #070a14 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      padding: 30px 0 60px 0;
      text-align: center;
    }

    a {
      color: inherit;
    }

    /* ==========================================
       完全な4層構造（サイズ・速度違い）の動く星空
       ========================================== */
    #stars, #stars2, #stars3, #stars4 {
      position: fixed;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 1;
      pointer-events: none;
    }

    /* 1層目：極小・一番速い（30秒） */
    #stars {
      width: 1px;
      height: 1px;
      animation: animStar 30s linear infinite;
      box-shadow: 
        100px 300px #fff, 400px 800px #fff, 700px 100px #fff, 1100px 1500px #fff,
        1500px 400px #fff, 200px 1200px #fff, 900px 600px #fff, 1300px 1800px #fff,
        300px 1700px #fff, 800px 1100px #fff, 1200px 200px #fff, 1600px 900px #fff,
        500px 1400px #fff, 1000px 500px #fff, 1400px 1300px #fff, 50px 700px #fff;
    }

    /* 2層目：小・速い（60秒） */
    #stars2 {
      width: 1.5px;
      height: 1.5px;
      animation: animStar 60s linear infinite;
      box-shadow: 
        250px 150px #fff, 650px 950px #fff, 1050px 350px #fff, 1450px 1150px #fff,
        150px 1750px #fff, 850px 450px #fff, 1250px 1450px #fff, 450px 650px #fff,
        950px 1650px #fff, 1350px 750px #fff, 350px 1050px #fff, 1750px 250px #fff;
    }

    /* 3層目：中・ゆったり（90秒） */
    #stars3 {
      width: 2px;
      height: 2px;
      animation: animStar 90s linear infinite;
      box-shadow: 
        180px 600px #fff, 580px 1300px #fff, 980px 200px #fff, 1380px 900px #fff,
        380px 1600px #fff, 780px 400px #fff, 1180px 1100px #fff, 1580px 1800px #fff;
    }

    /* 4層目：大・一番ゆっくり＆ほんのりピンク紫（120秒） */
    #stars4 {
      width: 2.5px;
      height: 2.5px;
      animation: animStar 120s linear infinite;
      box-shadow: 
        300px 900px #ffd2fe, 800px 200px #c1c1ff, 1200px 1400px #fff, 1600px 500px #ffd2fe,
        100px 1600px #fff, 600px 700px #c1c1ff, 1400px 1000px #ffd2fe;
    }

    @keyframes animStar {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    /* ==========================================
       透明ボックス & 更新履歴 (端から端まで)
       ========================================== */
    .box {
      width: 100%;
      background: linear-gradient(to right, rgba(1, 6, 51, 0.6), rgba(0, 0, 0, 0.6));
      color: #fff;
      margin: 20px 0;
      text-align: center;
      padding: 15px 0;
      box-sizing: border-box;
      min-height: 60px;
    }

    .sub-text-1 {
      font-size: 18px;
      color: #ffc1ff;
      display: block;
      margin-bottom: 5px;
    }

    .sub-text-2 {
      font-size: 18px;
      color: #c1c1ff;
      display: block;
    }

    .box2 {
      width: 100%;
      background: linear-gradient(to right, rgba(1, 6, 51, 0.7), rgba(0, 0, 0, 0.7));
      color: #fff;
      margin: 40px 0;
      text-align: center;
      padding: 20px 0;
      box-sizing: border-box;
      line-height: 1.8;
    }

    .history-title {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .history-date {
      color: #e0c1ff;
    }

    .history-highlight {
      color: #ffc1e0;
    }

    /* ==========================================
       レイアウト用グリッド（2列並び・中央揃え）
       ========================================== */
    .grid-2col {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-bottom: 35px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 220px;
    }

    .btn-desc {
      font-size: 14px;
      color: #bf92fc;
      margin-top: 10px;
    }

    .section-margin {
      margin-bottom: 35px;
    }

    .icon-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .icon-group img {
      transition: transform 0.2s;
    }

    .icon-group img:hover {
      transform: scale(1.05);
    }

    .header-banner {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    /* ==========================================
       【添付画像そのままの完全二重ボタン構造】
       ========================================== */
    /* 下側の土台ボタン（濃い青紫＋周囲の発光オーラ） */
    .btn-glow2 {
      display: inline-block;
      position: relative;
      background: #7544f6;
      background: linear-gradient(to right, #6b34f5 0%, #b867e0 100%);
      border-radius: 50px;
      padding: 0 16px; /* 横にはみ出させる余白 */
      animation: glow 3s infinite ease-out;
    }

    @keyframes glow {
      0% { box-shadow: 0 0 20px #8b61f866; }
      50% { box-shadow: 0 0 50px #8b61f8ee; }
      100% { box-shadow: 0 0 20px #8b61f866; }
    }

    /* 上側に少し小さく重ねるメインボタン（明るいグラデーション） */
    .btn-glow {
      color: #fff !important;
      display: inline-block;
      background: linear-gradient(to right, #9d6eff 0%, #e8a5f8 100%);
      border: none;
      text-align: center;
      font-size: 20px;
      line-height: 48px;
      letter-spacing: 0.07em;
      text-decoration: none !important;
      text-transform: uppercase;
      padding: 0 25px;
      transition: 0.3s;
      border-radius: 50px;
      margin: 3px 0; /* 下側ボタンが見えるように上下余白 */
      position: relative;
      z-index: 1;
    }

    .btn-hover-shine {
      position: relative;
      overflow: hidden;
    }

    .btn-hover-shine:after {
      content: '';
      position: absolute;
      display: block;
      top: 0;
      height: 100%;
      right: 80%;
      width: 1px;
      background-color: #ffffff00;
      box-shadow: 0 0 20px #ffd2fe00, 0 0 10px #ffd2fe00;
      opacity: 1;
    }

    .btn-hover-shine:hover:after {
      right: 2%;
      background-color: #ffffff;
      box-shadow: 0 0 30px #ffd2feff, 0 0 15px #ffd2feff;
      opacity: 0;
      transition: 0.6s;
    }

    .copyright {
      color: #9966ff;
      font-size: 16px;
      margin-top: 30px;
    }
  </style>
</head>
