<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャビノスケのWebサイト</title>
  <style>
    /* ==========================================
       全体基本設定 & キャプチャ再現背景グラデーション
       ========================================== */
    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* キャプチャ画像を再現した背景カラー */
      background: radial-gradient(ellipse at bottom, #071246 45%, #090a0f 70%);
      background-attachment: fixed;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* 下部から立ち上るピンク紫の光のレイヤー */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70vh;
      background: radial-gradient(ellipse at bottom, rgba(138, 97, 248, 0.35) 0%, rgba(117, 68, 246, 0.15) 50%, transparent 80%);
      pointer-events: none;
      z-index: 1;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      padding: 30px 0 60px 0;
      text-align: center;
    }

    a {
      color: inherit;
    }

    /* ==========================================
       4層構造の動く星空アニメーション (#stars〜4)
       ========================================== */
    #stars, #stars2, #stars3, #stars4 {
      position: fixed;
      top: 0;
      left: 0;
      background: transparent;
      z-index: 1;
      pointer-events: none;
    }

    #stars {
      width: 1px;
      height: 1px;
      animation: animStar 180s linear infinite;
      box-shadow: 
        779px 1331px #fff, 324px 42px #fff, 303px 586px #fff, 1312px 276px #fff,
        451px 625px #fff, 521px 1931px #fff, 1087px 1871px #fff, 36px 1546px #fff,
        132px 934px #fff, 1698px 901px #fff, 1418px 664px #fff, 1448px 1157px #fff,
        1084px 232px #fff, 347px 1776px #fff, 1722px 243px #fff, 1629px 835px #fff,
        479px 969px #fff, 1231px 960px #fff, 586px 384px #fff;
    }

    #stars2 {
      width: 1.5px;
      height: 1.5px;
      animation: animStar 120s linear infinite;
      box-shadow: 
        120px 450px #fff, 890px 120px #fff, 600px 900px #fff, 1500px 300px #fff,
        300px 1600px #fff, 1100px 1400px #fff, 400px 700px #fff, 1700px 1100px #fff,
        950px 1800px #fff, 150px 1100px #fff;
    }

    #stars3 {
      width: 2px;
      height: 2px;
      animation: animStar 80s linear infinite;
      box-shadow: 
        500px 200px #fff, 1300px 800px #fff, 200px 1000px #fff, 900px 1500px #fff,
        1600px 600px #fff, 700px 1200px #fff, 100px 300px #fff, 1400px 1700px #fff;
    }

    #stars4 {
      width: 2.5px;
      height: 2.5px;
      animation: animStar 50s linear infinite;
      box-shadow: 
        800px 500px #ffc1ff, 300px 1200px #c1c1ff, 1200px 300px #fff, 600px 1700px #ffc1ff;
    }

    @keyframes animStar {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    /* ==========================================
       透明ボックス & 更新履歴 (端から端まで)
       ========================================== */
    .box {
      width: 100%;
      background: linear-gradient(to right, rgba(1, 6, 51, 0.6), rgba(0, 0, 0, 0.6));
      color: #fff;
      margin: 20px 0;
      text-align: center;
      padding: 15px 0;
      box-sizing: border-box;
      min-height: 60px;
    }

    .sub-text-1 {
      font-size: 18px;
      color: #ffc1ff;
      display: block;
      margin-bottom: 5px;
    }

    .sub-text-2 {
      font-size: 18px;
      color: #c1c1ff;
      display: block;
    }

    .box2 {
      width: 100%;
      background: linear-gradient(to right, rgba(1, 6, 51, 0.7), rgba(0, 0, 0, 0.7));
      color: #fff;
      margin: 40px 0;
      text-align: center;
      padding: 20px 0;
      box-sizing: border-box;
      line-height: 1.8;
    }

    .history-title {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .history-date {
      color: #e0c1ff;
    }

    .history-highlight {
      color: #ffc1e0;
    }

    /* ==========================================
       レイアウト用グリッド（2列並び・中央揃え）
       ========================================== */
    .grid-2col {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-bottom: 35px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 220px;
    }

    .btn-desc {
      font-size: 14px;
      color: #bf92fc;
      margin-top: 10px;
    }

    .section-margin {
      margin-bottom: 35px;
    }

    .icon-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .icon-group img {
      transition: transform 0.2s;
    }

    .icon-group img:hover {
      transform: scale(1.05);
    }

    .header-banner {
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    /* ==========================================
       【オリジナル完全復元】ボタンCSS (.btn-glow / .btn-glow2)
       ========================================== */
    /* 外側の発光枠ボタン */
    .btn-glow2 {
      color: #fff !important;
      display: inline-block;
      background: #7544f6;
      background: -moz-linear-gradient(left, rgba(117,68,246,1) 0%, rgba(203,139,232,1) 100%);
      background: -webkit-linear-gradient(left, rgba(117,68,246,1) 0%,rgba(203,139,232,1) 100%);
      background: linear-gradient(to right, rgba(117,68,246,1) 0%,rgba(203,139,232,1) 100%);
      border: none;
      text-align: center;
      font-size: 22px;
      line-height: 53px;
      letter-spacing: 0.07em;
      text-decoration: none !important;
      text-transform: uppercase;
      padding: 0 20px;
      transition: 0.3s;
      -webkit-transition: 0.3s;
      box-shadow: none;
      animation: glow 3s infinite ease-out;
      position: relative;
      border-radius: 50px;
    }

    .btn-glow2:hover {
      box-shadow: 0 0 0 10px #3daaa200;
      transition: .20s;
      -webkit-transition: .20s;
      background: -moz-linear-gradient(left, rgba(203,139,232,1) 0%, rgba(117,68,246,1) 100%);
      background: -webkit-linear-gradient(left, rgba(203,139,232,1) 0%,rgba(117,68,246,1) 100%);
      background: linear-gradient(to right, rgba(203,139,232,1) 0%,rgba(117,68,246,1) 100%);
    }

    @keyframes glow {
      0% { box-shadow: 0 0 20px #8b61f844; text-shadow: 0 0 0px #fff; }
      50% { box-shadow: 0 0 50px #8b61f8ee; text-shadow: 0 0 30px #fff; }
      100% { box-shadow: 0 0 20px #8b61f844; text-shadow: 0 0 1px #fff; }
    }

    /* 内側のリンク（ボタンテキスト＆キラッと光る線） */
    .btn-glow {
      color: #fff !important;
      text-decoration: none !important;
      display: inline-block;
      width: 100%;
      height: 100%;
    }

    .btn-hover-shine {
      position: relative;
    }

    .btn-hover-shine:after {
      content: '';
      position: absolute;
      display: block;
      top: 0;
      height: 100%;
      right: 80%;
      width: 1px;
      background-color: #ffffff00;
      box-shadow: 0 0 20px #ffd2fe00, 0 0 10px #ffd2fe00, 0 0 5px #ffd2fe00, 0 0 2px #ffd2fe00;
      opacity: 1;
    }

    .btn-hover-shine:hover:after {
      right: 2%;
      background-color: #ffffffff;
      box-shadow: 0 0 30px #ffd2feff, 0 0 15px #ffd2feff, 0 0 7px #ffd2feff, 0 0 3px #ffd2feff;
      opacity: 0;
      transition: 0.6s;
      -webkit-transition: 0.6s;
    }

    .copyright {
      color: #9966ff;
      font-size: 16px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
  <div id="stars4"></div>

  <div class="wrapper">
    <img src="/image/chabiland20251121_2.png" alt="chabi land" class="header-banner" width="594" height="154">

    <div class="box">
      <span class="sub-text-1">ADV・ノベルゲーム制作&ensp;チャビノスケのWebサイト</span>
      <span class="sub-text-2">ゲーム 他 色々まとめです</span>
    </div>

    <div style="height: 30px;"></div>

    <div class="grid-2col">
      <div class="grid-item">
        <div class="btn-glow2">
          <a href="readme.html" target="_blank" class="btn-glow btn-hover-shine">&ensp;Read me&ensp;</a>
        </div>
        <div class="btn-desc">規約など</div>
      </div>

      <div class="grid-item">
        <div class="btn-glow2">
          <a href="https://chabinosukede.gozaru.jp/game.html" target="_blank" class="btn-glow btn-hover-shine">&emsp;&ensp;Game&ensp;&emsp;</a>
        </div>
        <div class="btn-desc">制作したゲーム</div>
      </div>
    </div>

    <div class="grid-2col">
      <div class="grid-item">
        <div class="btn-glow2">
          <a href="https://ci-en.net/creator/272
